        async function submitTanyaAI() {

            chatResults.scrollTop = chatResults.scrollHeight;

            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyusun Jawaban...`;

            const loadingId = 'loading-' + Date.now();

                    <div class="bg-gray-950 border border-gold-500/30 rounded-2xl p-4 text-gray-200 text-sm mr-8 space-y-2">
                        <p class="font-bold text-gold-400 flex items-center gap-1.5"><i class="fa-solid fa-check-circle"></i> Jawaban & Rujukan AI:</p>

            } catch (err) {

                    <div class="bg-red-950/40 border border-red-800 rounded-2xl p-4 text-red-300 text-sm mr-8">

            }

            btn.disabled = false;

        async function submitBuatKonten() {

            const resultsDiv = document.getElementById('konten-results');
            const btn = document.getElementById('konten-btn');

            if (!topik) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyusun...`;
            resultsDiv.innerHTML = `<div class="bg-gray-950 border border-emerald-900/40 rounded-2xl p-4 text-gray-400 text-sm">AI sedang merancang ${format} yang santun dan berkualitas...</div>`;

            try {
                const prompt = `Buatkan ${format} bertema "${topik}". Pastikan bahasanya santun, edukatif, bernilai dakwah yang baik, serta mencakup referensi dalil yang valid jika relevan.`;
                const response = await callGeminiAPI(prompt);

                resultsDiv.innerHTML = `
                    <div class="bg-gray-950 border border-blue-500/30 rounded-2xl p-5 text-gray-200 text-sm space-y-3">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                            <p class="font-bold text-blue-400 flex items-center gap-1.5"><i class="fa-solid fa-file-lines"></i> Hasil Konten (${format}):</p>
                            <button onclick="copyContent(this)" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-700 transition-colors">
                                <i class="fa-regular fa-copy mr-1"></i> Salin
                            </button>
                        </div>
                        <div id="copy-text-target" class="whitespace-pre-line leading-relaxed">${escapeHtml(response)}</div>
                    </div>
                `;
            } catch (err) {
                resultsDiv.innerHTML = `<div class="bg-red-950/40 border border-red-800 rounded-2xl p-4 text-red-300 text-sm">Gagal membuat konten. Silakan coba lagi.</div>`;
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Buat Konten`;
        }

        function copyContent(btn) {
            const textEl = document.getElementById('copy-text-target');
            const textArea = document.createElement("textarea");
            textArea.value = textEl.innerText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400 mr-1"></i> Tersalin!`;
            setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
        }

        // Gemini API Helper with exponential backoff
        async function callGeminiAPI(userQuery, retries = 3, delay = 1000) {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: DAKWAH_SYSTEM_PROMPT }]
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        return candidate.content.parts[0].text;
                    } else {
                        throw new Error("Struktur respons tidak valid.");
                    }
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initial load
        window.onload = function() {
            navigate('home');
        };
    </script>
